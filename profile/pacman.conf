#
# /etc/pacman.conf de AquaOS
#
# Es el pacman.conf estándar de Arch Linux. El instalador lo reutiliza para
# instalar el sistema en disco, así que mantenlo sin repos inventados.
#
[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
#RemoteFileSigLevel = Required

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
